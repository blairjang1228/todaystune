<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>song cache — debug</title><link rel="stylesheet" href="styles.css"><style>main{padding:70px clamp(22px,7vw,100px)}h1{font-family:'Special Elite';font-weight:400;color:var(--navy)}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:.8rem}th{color:var(--berry);text-transform:uppercase;letter-spacing:.1em;font-size:.65rem}a{color:var(--berry)}</style></head><body><main><p class="eyebrow">debug cache</p><h1>all cached songs</h1><p id="count"></p><table><thead><tr><th>Song</th><th>Artist</th><th>Album</th><th>Lyric</th><th>Sources</th></tr></thead><tbody id="rows"></tbody></table><p><a href="index.html">← back to today's tune</a></p></main><script>const songs=JSON.parse(localStorage.getItem('todaysTuneSongCache')||'[]');document.querySelector('#count').textContent=`${songs.length} cached entries`;document.querySelector('#rows').innerHTML=songs.map(s=>`<tr><td>${s.song}</td><td>${s.artist}</td><td>${s.album}</td><td>${s.lyric}</td><td><a href="${s.url}" target="_blank">song</a> · <a href="${s.video}" target="_blank">video</a></td></tr>`).join('');</script></body></html>
